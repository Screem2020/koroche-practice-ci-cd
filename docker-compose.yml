services:
  db:
    image: postgres:17
    container_name: test-cicd-db
    environment:
      POSTGRES_DB: ${DB_NAME:-testdb}
      POSTGRES_USER: ${DB_USERNAME:-testuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-testpass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-testuser} -d ${DB_NAME:-testdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
