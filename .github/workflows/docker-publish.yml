name: Build and Push Docker Image

# Запуск вручную по кнопке во вкладке Actions
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Клонируем репозиторий в раннер, чтобы был доступен Dockerfile и исходники
      - name: Checkout repository
        uses: actions/checkout@v4

      # Авторизуемся в GitHub Container Registry по встроенному GITHUB_TOKEN
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Готовим теги и labels образа (latest + короткий SHA коммита)
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      # Поднимаем Buildx — расширенный сборщик с поддержкой кеша и multi-platform
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Собираем образ из Dockerfile и пушим его в registry с кешированием слоёв
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
